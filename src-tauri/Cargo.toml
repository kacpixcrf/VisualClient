[package]
name = "visualclient"
version = "26.3.0"
description = "A visual client for Minecraft"
authors = ["kacpixcrf"]
edition = "2024"

[lib]
name = "visualclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dirs = "7"

tokio = { version = "1", features = ["time", "fs", "io-util", "process", "sync", "rt", "macros"] }

reqwest = { version = "0.13.4", features = ["stream", "json", "form"] }
futures-util = "0.3"

zip = "9"
tar = "0.4"
flate2 = "1"
walkdir = "2"

tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

minecraft-msa-auth = "0.5"
url = "2"
magic-crypt = "5"

fastnbt = "2"
craftping = { version = "0.8", features = ["async-tokio"] }
base64 = "0.23.1"
